services:
  postgres:
    image: postgres:16-alpine
    container_name: leaderos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leaderos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaderos}
      POSTGRES_DB: ${POSTGRES_DB:-leaderos_app}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - leaderos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leaderos} -d ${POSTGRES_DB:-leaderos}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leaderos-postgres-data:
    name: leaderos-postgres-data
